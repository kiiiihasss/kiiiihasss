<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-label="Rizki - Creative Developer. Full Stack Developer and UI Designer."><title>Rizki - Creative Developer. Full Stack Developer and UI Designer.</title><style>.s{font-family:-apple-system,'Segoe UI','Inter','Helvetica Neue',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,'Courier New',monospace}
    @keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    .a1{animation:up .9s .05s ease-out both}.a2{animation:up .9s .2s ease-out both}
    .a3{animation:up .9s .35s ease-out both}.a4{animation:up .9s .5s ease-out both}.a5{animation:up .9s .65s ease-out both}
